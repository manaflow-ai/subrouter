[package]
name = "subrouter"
version = "0.1.51"
edition = "2024"
rust-version = "1.97.1"
description = "A local proxy that routes coding-agent traffic across subscription accounts"
license = "MIT"
repository = "https://github.com/manaflow-ai/subrouter"
default-run = "subrouter"

[lib]
name = "subrouter"
path = "src/lib.rs"

[[bin]]
name = "subrouter"
path = "src/bin/subrouter.rs"

[[bin]]
name = "mockupstream"
path = "src/bin/mockupstream.rs"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.91"
aws-config = "1.10.1"
aws-credential-types = "1.3.0"
aws-sdk-servicequotas = { version = "1.107.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sigv4 = "1.5.1"
aws-smithy-runtime-api = "1.14.0"
axum = { version = "0.8.9", features = ["http2", "json", "macros", "ws"] }
base64 = "0.23.0"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.5", features = ["derive", "env", "string"] }
crc32fast = "1.5.0"
flate2 = "1.1.9"
fs2 = "0.4.3"
futures-util = { version = "0.3.33", features = ["sink"] }
hex = "0.4.3"
hostname = "0.4.2"
humantime = "2.4.0"
http = "1.5.0"
http-body-util = "0.1.4"
hyper = { version = "1.11.0", features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1.20", features = ["client", "client-legacy", "http1", "http2", "server", "tokio"] }
mailparse = "0.16.1"
percent-encoding = "2.3.2"
rand = "0.10.2"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["http2", "json", "query", "rustls", "stream"] }
rpassword = "7.5.4"
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_urlencoded = "0.7.1"
sha2 = "0.11.0"
socket2 = { version = "0.6.5", features = ["all"] }
subtle = "2.6.1"
tar = "0.4.46"
tempfile = "3.27.0"
terminal_size = "0.4.4"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
tokio-util = { version = "0.7.19", features = ["codec", "io", "rt"] }
tower = { version = "0.5.3", features = ["limit", "timeout", "util"] }
tower-http = { version = "0.7.0", features = ["catch-panic", "cors", "fs", "set-header", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
toml_edit = "0.25.13"
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.24.0", features = ["serde", "v4"] }
zeroize = { version = "1.9.0", features = ["derive"] }
zstd = "0.13.3"

[target.'cfg(unix)'.dependencies]
listenfd = "1.0.2"
nix = { version = "0.31.3", features = ["fs", "process", "signal", "socket", "user"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Threading",
] }

[dev-dependencies]
assert_cmd = "2.1.2"
predicates = "3.1.4"
proptest = "1.9.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
