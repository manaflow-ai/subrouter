name: Release

# A pushed tag builds and tests, then publishes the immutable binaries consumed
# by protected GCP deploys. The legacy pre-front updater reads the same release.
# npm/PyPI are not published on a tag; they are manual opt-in only through the
# workflow_dispatch toggles below.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_npm:
        description: "Also publish to npm (manual opt-in)"
        required: true
        type: boolean
        default: false
      publish_pypi:
        description: "Also publish to PyPI (manual opt-in)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build and verify artifacts
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_commit: ${{ steps.version.outputs.source_commit }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Determine release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
              echo "release tag must be versioned, for example v0.1.52" >&2
              exit 1
            }
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          source_commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
          echo "source_commit=${source_commit}" >> "${GITHUB_OUTPUT}"

      - name: Require release commit on protected main
        env:
          SOURCE_COMMIT: ${{ steps.version.outputs.source_commit }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${SOURCE_COMMIT}" origin/main || {
            echo "refusing to release a tag whose commit is not on origin/main" >&2
            exit 1
          }

      - name: Test Go packages
        run: CGO_ENABLED=0 go test ./...

      - name: Build Go release binaries
        run: scripts/build-release.sh "${{ steps.version.outputs.version }}"

      - name: Copy shell installer into release assets
        env:
          SOURCE_COMMIT: ${{ steps.version.outputs.source_commit }}
        run: |
          set -euo pipefail
          cp install.sh dist/release/install.sh
          jq -n --arg tag "${GITHUB_REF_NAME}" --arg source_revision "${SOURCE_COMMIT}" \
            '{tag:$tag,source_revision:$source_revision,tag_on_main:true}' \
            >dist/release/SOURCE_PROVENANCE.json
          (
            cd dist/release
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' \
              | LC_ALL=C sort \
              | xargs sha256sum >SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Attest complete release asset set
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/release/*

      - name: Upload Go release artifacts
        uses: actions/upload-artifact@v5
        with:
          name: release-assets
          path: dist/release/*
          if-no-files-found: error

  github-release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    permissions:
      contents: write
      attestations: read
    steps:
      - name: Download Go release artifacts
        uses: actions/download-artifact@v5
        with:
          name: release-assets
          path: dist/release

      - name: Stage, verify, and publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: v${{ needs.build.outputs.version }}
          SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
        run: |
          set -euo pipefail
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "refusing to mutate existing release ${TAG_NAME}" >&2
            exit 1
          fi
          (
            cd dist/release
            sha256sum --check SHA256SUMS
          )
          gh release create "${TAG_NAME}" --draft --verify-tag \
            --title "Subrouter ${TAG_NAME}" \
            --notes "Subrouter ${TAG_NAME}"
          gh release upload "${TAG_NAME}" dist/release/*

          local_assets="$(mktemp)"
          remote_assets="$(mktemp)"
          find dist/release -maxdepth 1 -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | awk '{name=$2; sub(/^.*\//,"",name); print name " sha256:" $1}' \
            | LC_ALL=C sort >"${local_assets}"
          gh release view "${TAG_NAME}" --json isDraft,assets \
            --jq 'if .isDraft then .assets[] | [.name,.digest] | @tsv else error("release published before verification") end' \
            | LC_ALL=C sort >"${remote_assets}"
          diff -u "${local_assets}" "${remote_assets}"

          mkdir -p dist/attestation-verification
          while IFS= read -r asset; do
            name="$(basename "${asset}")"
            verification="$(gh attestation verify "${asset}" \
              --repo manaflow-ai/subrouter \
              --signer-workflow manaflow-ai/subrouter/.github/workflows/release.yml \
              --source-ref "refs/tags/${TAG_NAME}" \
              --source-digest "${SOURCE_COMMIT}" \
              --deny-self-hosted-runners --format json)"
            jq --arg asset "${name}" --arg source_revision "${SOURCE_COMMIT}" \
              '{asset:$asset,source_revision:$source_revision,verified_attestations:length,
                subjects:[.[].verificationResult.statement.subject[] | {name,digest}]}' \
              <<<"${verification}" >"dist/attestation-verification/${name}.json"
            jq -e '.verified_attestations > 0' "dist/attestation-verification/${name}.json" >/dev/null
          done < <(find dist/release -maxdepth 1 -type f | LC_ALL=C sort)

          gh release edit "${TAG_NAME}" --draft=false
          gh release view "${TAG_NAME}" --json isDraft,isImmutable \
            --jq '(.isDraft == false and .isImmutable == true) or error("published release is not immutable")'
          while IFS= read -r asset; do
            gh release verify-asset "${TAG_NAME}" "${asset}" --format json >/dev/null
          done < <(find dist/release -maxdepth 1 -type f | LC_ALL=C sort)

  # Manual opt-in only. These never run on a tag push; trigger this workflow via
  # the Actions "Run workflow" button with the toggle enabled to publish.
  npm-publish:
    name: Publish npm package (manual)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_npm }}
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        run: npm publish --access public

  pypi-publish:
    name: Publish PyPI package (manual)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_pypi }}
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build Python package
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/subrouter-*.tar.gz dist/subrouter-*.whl

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
