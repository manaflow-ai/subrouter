name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, vet, test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: CGO_ENABLED=0 go test ./...

      - name: Test optional shadow rehearsal
        run: python3 deploy/tests/run-shadow-rehearsal-test.py

      # CI only builds for linux/amd64, but releases cross-compile for every
      # platform below. A platform-specific symbol (syscall.SIGUSR1 does not
      # exist on Windows) therefore passed CI, merged, and only broke at
      # release tag time. Catch it on the PR instead.
      - name: Cross-compile release targets
        run: |
          set -euo pipefail
          for target in \
            darwin/amd64 darwin/arm64 \
            linux/386 linux/amd64 linux/arm linux/arm64 \
            windows/386 windows/amd64 windows/arm64 \
            freebsd/386 freebsd/amd64 freebsd/arm64 \
            netbsd/amd64 netbsd/arm64 \
            openbsd/amd64 openbsd/arm64
          do
            echo "building ${target}"
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -o /dev/null ./...
          done

  docker-smoke:
    name: Docker local and team profiles
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Exercise both profiles under the production memory limit
        run: deploy/docker/smoke-test.sh

  macos-launchagent-transaction:
    name: macOS LaunchAgent transaction
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test optional shadow rehearsal
        run: python3 deploy/tests/run-shadow-rehearsal-test.py

      - name: Test functional canary runner and helper
        run: |
          python3 deploy/macos/tests/run-functional-canary-test.py
          go test ./internal/cutovercanary ./cmd/subrouter-cutover-canary -count=1
          go test ./cmd/subrouter \
            -run 'TestLaunchAgentFunctionalCanary|TestPeerProbeSubcommand|TestLegResultHasExactRunnerKeys|TestMacOSAutoUpdaterDefers|TestParseSupervisorConfigRequiresAbsoluteUpgradeInhibitFile|TestUpgradeInhibitMarkerBlocksGenerationChange|TestSlotRetirementDrainsPinnedStreamBeforeSupervisorExit' \
            -count=1

      - name: Test rollback and signal transaction matrix
        run: deploy/macos/tests/launchagent-transaction-test.sh
