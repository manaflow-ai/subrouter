name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, vet, test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: CGO_ENABLED=0 go test ./...

      - name: Package exact-head canary candidate
        if: github.event_name == 'pull_request'
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sr-canary"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -buildvcs=true \
            -ldflags="-s -w" \
            -o "$RUNNER_TEMP/sr-canary/subrouter-darwin-arm64" ./cmd/subrouter
          printf '%s\n' "$SOURCE_SHA" > "$RUNNER_TEMP/sr-canary/source-sha.txt"
          (cd "$RUNNER_TEMP/sr-canary" && sha256sum subrouter-darwin-arm64 > SHA256SUMS)

      - name: Upload canary candidate
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: canary-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/sr-canary/
          retention-days: 7

      # CI only builds for linux/amd64, but releases cross-compile for every
      # platform below. A platform-specific symbol (syscall.SIGUSR1 does not
      # exist on Windows) therefore passed CI, merged, and only broke at
      # release tag time. Catch it on the PR instead.
      - name: Cross-compile release targets
        run: |
          set -euo pipefail
          for target in \
            darwin/amd64 darwin/arm64 \
            linux/386 linux/amd64 linux/arm linux/arm64 \
            windows/386 windows/amd64 windows/arm64 \
            freebsd/386 freebsd/amd64 freebsd/arm64 \
            netbsd/amd64 netbsd/arm64 \
            openbsd/amd64 openbsd/arm64
          do
            echo "building ${target}"
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -o /dev/null ./...
          done

  docker-smoke:
    name: Docker local and team profiles
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Exercise both profiles under the production memory limit
        run: deploy/docker/smoke-test.sh
