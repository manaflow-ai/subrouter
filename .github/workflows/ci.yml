name: CI

on:
  pull_request:
  # The merge queue requires "Build, vet, test" on each merge group commit,
  # i.e. the pull request applied on top of main and every entry ahead of it.
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read

# Each merge queue entry has its own gh-readonly-queue/... ref, so entries
# never cancel one another.
concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull request pushes are moot, but every commit on main needs a
  # finished run. Cancelling main pushes meant rapid merges left main with no
  # completed result at all, so "is main red?" had no answer.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # "Build, vet, test" is the long-standing required check. It is now a
  # small gate over jobs that run in parallel, so wall time is the slowest
  # of them rather than their sum.
  test:
    name: Build, vet, test
    runs-on: ubuntu-latest
    needs: [unit, cross-compile, shadow-rehearsal, deploy-scripts]
    # Run when a gated job fails (so the required check fails too), but not
    # when the whole run is cancelled because a newer push superseded it:
    # that run's result is moot and would only post a red check on the old
    # commit.
    if: ${{ !cancelled() }}
    steps:
      - name: Require every gated job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "gated job results: ${RESULTS}"
          for result in ${RESULTS}; do
            [ "${result}" = "success" ] || exit 1
          done

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check formatting
        # Nothing checked gofmt, so unformatted files reached main.
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "::error title=gofmt::run gofmt -w on these files:"
            echo "${unformatted}"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: CGO_ENABLED=0 go test ./...

      - name: Test CLA workflow policy
        # tests/ had no CI wiring, so a change that made the CLA required check
        # fail on every ordinary pull request reached main unnoticed.
        run: |
          shopt -s nullglob
          for suite in tests/*.sh; do
            echo "== ${suite}"
            bash "${suite}"
          done

  deploy-scripts:
    name: Deploy scripts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Test macOS deploy guard and installer scripts
        # Both suites drive the scripts against fake launchctl, a fake
        # supervisor control socket, and file:// health probes, so they run on
        # Linux. They previously had no CI wiring at all.
        run: |
          bash deploy/macos/tests/guard-rollback-test.sh
          bash deploy/macos/tests/deploy-install-test.sh

      - name: Shellcheck deploy scripts
        # Error severity only: the warning-level findings are deliberate
        # patterns (e.g. `check "..." $?` after a test) in existing scripts.
        # shellcheck is preinstalled on the ubuntu runner image.
        run: |
          shopt -s globstar nullglob
          shellcheck --version
          shellcheck -S error deploy/**/*.sh

  shadow-rehearsal:
    name: Shadow rehearsal
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Test optional shadow rehearsal
        # The full shadow suite runs on Linux. The hosted macOS image does
        # not permit loopback listeners from child fixtures.
        run: python3 deploy/tests/run-shadow-rehearsal-test.py

  # CI tests only linux/amd64, but releases cross-compile for every platform
  # below. A platform-specific symbol (syscall.SIGUSR1 does not exist on
  # Windows) therefore passed CI, merged, and only broke at release tag time.
  # Catch it on the PR instead.
  #
  # One runner building all 16 targets was the slowest job most PRs waited
  # on, and a third of it was moving a 2.6 GB build cache that was re-saved
  # under a new key on every run. Each OS group now runs as its own job with
  # at most one target per runner core, and keeps a small build cache of its
  # own (setup-go's cache never saves cross-compiled objects once its key
  # already exists). Only main saves those caches; pull requests restore
  # main's copy and never write one.
  cross-compile:
    name: Cross-compile release targets (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: darwin
            targets: darwin/amd64 darwin/arm64
          - group: linux
            targets: linux/386 linux/amd64 linux/arm linux/arm64
          - group: windows
            targets: windows/386 windows/amd64 windows/arm64
          - group: freebsd
            targets: freebsd/386 freebsd/amd64 freebsd/arm64
          - group: netbsd-openbsd
            targets: netbsd/amd64 netbsd/arm64 openbsd/amd64 openbsd/arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore cross-compile build cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          # go.mod is in the key so a toolchain bump starts a fresh cache
          # rather than restoring stdlib objects the new compiler ignores.
          key: cross-${{ matrix.group }}-${{ hashFiles('go.mod', 'go.sum') }}

      - name: Cross-compile
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          set -euo pipefail
          go mod download
          printf '%s\n' ${TARGETS} |
            xargs -P "$(nproc)" -I{} sh -c '
              target="{}"
              if CGO_ENABLED=0 GOOS="${target%/*}" GOARCH="${target#*/}" go build -o /dev/null ./... 2>"/tmp/build-${target%/*}-${target#*/}.log"; then
                echo "ok      ${target}"
              else
                echo "FAILED  ${target}"; cat "/tmp/build-${target%/*}-${target#*/}.log"; exit 255
              fi'

      - name: Save cross-compile build cache
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.cache.outputs.cache-primary-key }}

  docker-smoke:
    name: Docker local and team profiles
    # Not gated by "Build, vet, test", so nothing in the queue waits on it.
    # It already ran on the pull request and runs again on the push to main.
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Exercise both profiles under the production memory limit
        run: deploy/docker/smoke-test.sh

  # The macOS job takes 5-7 minutes, three times the next slowest job, so it
  # set the wait for every pull request even when nothing macOS-specific
  # changed. It still runs on every push to main, and on any pull request
  # touching the paths below. Any error listing files runs it anyway.
  changes:
    name: Detect macOS-relevant changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      macos: ${{ steps.filter.outputs.macos }}
      matrix: ${{ steps.filter.outputs.matrix }}
    steps:
      - name: Classify changed files
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "${EVENT}" != "pull_request" ]; then
            printf 'macos=true\nmatrix=true\n' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if ! files="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --jq '.[].filename')"; then
            echo "::warning::could not list changed files; running the macOS job"
            printf 'macos=true\nmatrix=true\n' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          pattern='^(deploy/macos/|cmd/subrouter/|cmd/subrouter-cutover-canary/|internal/cutovercanary/|go\.(mod|sum)$|\.github/workflows/ci\.yml$)|_darwin(_test)?\.go$'
          if printf '%s\n' "${files}" | grep -qE "${pattern}"; then
            echo "macos=true" >> "${GITHUB_OUTPUT}"
          else
            echo "macos=false" >> "${GITHUB_OUTPUT}"
          fi
          # The transaction matrix is 5 of the job's 6.5 minutes, and it only
          # drives the shell and Python scripts under deploy/macos/ against a
          # fake launchctl. It builds no Go, so Go changes that still need the
          # canary tests above do not need it.
          if printf '%s\n' "${files}" | grep -qE '^(deploy/macos/|\.github/workflows/ci\.yml$)'; then
            echo "matrix=true" >> "${GITHUB_OUTPUT}"
          else
            echo "matrix=false" >> "${GITHUB_OUTPUT}"
          fi

  macos-launchagent-transaction:
    name: macOS LaunchAgent transaction
    # Not gated by "Build, vet, test", so nothing in the queue waits on it.
    # It already ran on the pull request and runs again on the push to main.
    runs-on: macos-latest
    needs: changes
    if: ${{ github.event_name != 'merge_group' && needs.changes.outputs.macos == 'true' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test functional canary runner and helper
        run: |
          python3 deploy/macos/tests/run-functional-canary-test.py
          go test ./internal/cutovercanary ./cmd/subrouter-cutover-canary -count=1
          go test ./cmd/subrouter \
            -run 'TestLaunchAgentFunctionalCanary|TestPeerProbeSubcommand|TestLegResultHasExactRunnerKeys|TestMacOSAutoUpdaterDefers|TestParseSupervisorConfigRequiresAbsoluteUpgradeInhibitFile|TestUpgradeInhibitMarkerBlocksGenerationChange|TestSlotRetirementDrainsPinnedStreamBeforeSupervisorExit' \
            -count=1

      - name: Test rollback and signal transaction matrix
        if: ${{ needs.changes.outputs.matrix == 'true' }}
        run: deploy/macos/tests/launchagent-transaction-test.sh
