name: GCP Deploy Preflight

on:
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: "GCP environment to deploy"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      operation:
        description: "Topology the local Mac golden will mutate after this preflight"
        required: true
        default: "slot"
        type: choice
        options:
          - slot
          - migrate-front
      release_tag:
        description: "Existing immutable GitHub release tag (for example v0.1.52)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Production and staging share one URL map, so serialize their one-time
  # migrations. Routine slot deploys remain isolated by environment.
  group: gcp-deploy-${{ inputs.operation == 'migrate-front' && 'shared-url-map' || inputs.deploy_environment }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SUBROUTER_GCP_PROJECT: ${{ vars.SUBROUTER_GCP_PROJECT }}
  SUBROUTER_GCP_ZONE: ${{ vars.SUBROUTER_GCP_ZONE }}
  SUBROUTER_GCP_INSTANCE: ${{ inputs.deploy_environment == 'production' && 'subrouter-team' || 'subrouter-staging' }}
  SUBROUTER_PUBLIC_BASE_URL: ${{ inputs.deploy_environment == 'production' && 'https://sr.cmux.com' || 'https://staging.sr.cmux.com' }}
  SUBROUTER_RELEASE_TAG: ${{ inputs.release_tag }}
  SUBROUTER_RELEASE_ARCH: amd64
  SUBROUTER_RELEASE_OUTPUT: ${{ github.workspace }}/dist/subrouter-linux-amd64
  SUBROUTER_DEPLOY_BINARY: ${{ github.workspace }}/dist/subrouter-linux-amd64
  SUBROUTER_RELEASE_SHA256_FILE: ${{ github.workspace }}/dist/subrouter-linux-amd64.sha256

jobs:
  deploy:
    name: Preflight ${{ inputs.release_tag }} for ${{ inputs.deploy_environment }} ${{ inputs.operation }}
    if: >-
      github.repository == 'manaflow-ai/subrouter' &&
      github.ref == 'refs/heads/main' &&
      (inputs.deploy_environment == 'staging' || inputs.deploy_environment == 'production') &&
      (inputs.operation == 'slot' || inputs.operation == 'migrate-front')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: subrouter-${{ inputs.deploy_environment }}
    permissions:
      contents: read # Read the trusted deployment tooling and release metadata.
      id-token: write # Mint the short-lived OIDC token used by Google workload identity.
      attestations: read # Verify GitHub build attestations before cloud authentication.
    steps:
      - name: Check out trusted deployment tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Pin trusted tooling to the dispatch commit. The job guard permits
          # only workflow runs selected from the protected main branch.
          ref: ${{ github.sha }}
          path: deploy-tooling
          persist-credentials: false

      - name: Check out matching release source for observer tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.release_tag }}
          path: release-source
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: release-source/go.mod

      - name: Verify trusted release before Google authentication
        working-directory: deploy-tooling
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "${GITHUB_WORKSPACE}/dist" "${GITHUB_WORKSPACE}/artifacts/build-provenance"
          deploy/gcp/fetch-release.sh | tee "${GITHUB_WORKSPACE}/artifacts/build-provenance/release-fetch.txt"
          version="${SUBROUTER_RELEASE_TAG#v}"
          binary_asset="subrouter_${version}_linux_amd64"
          release_asset_dir="${GITHUB_WORKSPACE}/dist/release-assets"
          mkdir -p "${release_asset_dir}"
          required_assets=(SHA256SUMS SOURCE_PROVENANCE.json deployment-contract.py install.sh install-front-slots.sh "${binary_asset}")
          download_args=()
          for asset in "${required_assets[@]}"; do
            download_args+=(--pattern "${asset}")
          done
          gh release download "${SUBROUTER_RELEASE_TAG}" --repo manaflow-ai/subrouter \
            --dir "${release_asset_dir}" "${download_args[@]}"
          release_state="${GITHUB_WORKSPACE}/artifacts/build-provenance/release-state.json"
          gh release view "${SUBROUTER_RELEASE_TAG}" --repo manaflow-ai/subrouter \
            --json isDraft,isImmutable,tagName,targetCommitish,assets >"${release_state}"
          jq -e --arg tag "${SUBROUTER_RELEASE_TAG}" \
            '.tagName == $tag and (.isDraft | not) and .isImmutable' "${release_state}" >/dev/null
          go version -m "${SUBROUTER_DEPLOY_BINARY}" \
            | tee "${GITHUB_WORKSPACE}/artifacts/build-provenance/candidate.txt"
          release_commit="$(git -C "${GITHUB_WORKSPACE}/release-source" rev-parse HEAD)"
          printf '%s\n' "${release_commit}" | tee "${GITHUB_WORKSPACE}/artifacts/build-provenance/release-source-commit.txt"
          git -C "${GITHUB_WORKSPACE}/release-source" fetch --no-tags origin main
          git -C "${GITHUB_WORKSPACE}/release-source" merge-base --is-ancestor \
            "${release_commit}" origin/main || {
              echo "release tag commit is not on protected main" >&2
              exit 1
            }
          bash deploy/gcp/verify-go-release-binary.sh "${SUBROUTER_DEPLOY_BINARY}" "${release_commit}"
          declare -A digests=()
          for asset in "${required_assets[@]}"; do
            path="${release_asset_dir}/${asset}"
            [[ -f "${path}" && ! -L "${path}" ]]
            digests["${asset}"]="$(sha256sum "${path}" | awk '{print $1}')"
            jq -e --arg asset "${asset}" --arg digest "sha256:${digests[${asset}]}" \
              '[.assets[]? | select(.name == $asset and .digest == $digest)] | length == 1' \
              "${release_state}" >/dev/null
            gh release verify-asset "${SUBROUTER_RELEASE_TAG}" "${path}" \
              --repo manaflow-ai/subrouter --format json >/dev/null
            gh attestation verify "${path}" \
              --repo manaflow-ai/subrouter \
              --signer-workflow manaflow-ai/subrouter/.github/workflows/release.yml \
              --source-ref "refs/tags/${SUBROUTER_RELEASE_TAG}" \
              --source-digest "${release_commit}" \
              --deny-self-hosted-runners --format json \
              | jq -e 'length > 0' >/dev/null
          done
          [[ "$(sha256sum "${SUBROUTER_DEPLOY_BINARY}" | awk '{print $1}')" == "${digests[${binary_asset}]}" ]]
          for asset in SOURCE_PROVENANCE.json deployment-contract.py install.sh install-front-slots.sh "${binary_asset}"; do
            [[ "$(python3 deploy/gcp/deployment-contract.py manifest-sha \
              "${release_asset_dir}/SHA256SUMS" "${asset}")" == "${digests[${asset}]}" ]]
          done
          jq -e --arg tag "${SUBROUTER_RELEASE_TAG}" --arg revision "${release_commit}" \
            '(. | keys | sort) == (["source_revision","tag","tag_on_main"] | sort) and
             .tag == $tag and .source_revision == $revision and .tag_on_main == true' \
            "${release_asset_dir}/SOURCE_PROVENANCE.json" >/dev/null
          release_verification="${GITHUB_WORKSPACE}/artifacts/build-provenance/release-verification.json"
          jq -n --arg schema 'subrouter.release-verification/v1' \
            --arg release_tag "${SUBROUTER_RELEASE_TAG}" --arg source_revision "${release_commit}" \
            --arg sums "${digests[SHA256SUMS]}" \
            --arg provenance "${digests[SOURCE_PROVENANCE.json]}" \
            --arg deployment_contract "${digests[deployment-contract.py]}" \
            --arg installer "${digests[install.sh]}" \
            --arg front_installer "${digests[install-front-slots.sh]}" \
            --arg binary_name "${binary_asset}" --arg binary "${digests[${binary_asset}]}" \
            '{schema:$schema,release_tag:$release_tag,source_revision:$source_revision,
              tag_on_main:true,release_published:true,release_immutable:true,
              asset_digest_verified:true,strict_build_attestation_verified:true,
              provenance_verified:true,embedded_revision_verified:true,
              assets:{"SHA256SUMS":$sums,"SOURCE_PROVENANCE.json":$provenance,
                "deployment-contract.py":$deployment_contract,"install.sh":$installer,
                "install-front-slots.sh":$front_installer,($binary_name):$binary}}' \
            >"${release_verification}"
          chmod 0600 "${release_verification}"
          {
            echo "SUBROUTER_DEPLOY_REVISION=${release_commit}"
            echo "SUBROUTER_RELEASE_TAG_ON_MAIN=true"
            echo "SUBROUTER_RELEASE_ATTESTATION_VERIFIED=true"
            echo "SUBROUTER_RELEASE_IMMUTABLE=true"
            echo "SUBROUTER_RELEASE_ASSET_DIR=${release_asset_dir}"
            echo "SUBROUTER_RELEASE_VERIFICATION_JSON=${release_verification}"
            echo "SUBROUTER_INSTALL_FRONT_SLOTS=${release_asset_dir}/install-front-slots.sh"
            echo "SUBROUTER_DEPLOYMENT_CONTRACT=${release_asset_dir}/deployment-contract.py"
          } >>"${GITHUB_ENV}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.SUBROUTER_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SUBROUTER_GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Validate live topology without mutation
        working-directory: deploy-tooling
        env:
          SUBROUTER_PREFLIGHT_TOPOLOGY: ${{ inputs.operation }}
          SUBROUTER_DEPLOY_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/gcp-preflight
        run: deploy/gcp/preflight-deployment.sh --evidence-json "${GITHUB_WORKSPACE}/artifacts/gcp-preflight/result.json"

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: gcp-${{ inputs.deploy_environment }}-${{ inputs.operation }}-${{ inputs.release_tag }}-${{ github.run_attempt }}
          path: artifacts
          if-no-files-found: warn
