name: GCP Deploy Preflight

on:
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: "GCP environment to deploy"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      operation:
        description: "Topology the local Mac golden will mutate after this preflight"
        required: true
        default: "slot"
        type: choice
        options:
          - slot
          - migrate-front
      release_tag:
        description: "Existing immutable GitHub release tag (for example v0.1.52)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: read

concurrency:
  # Production and staging share one URL map, so serialize their one-time
  # migrations. Routine slot deploys remain isolated by environment.
  group: gcp-deploy-${{ inputs.operation == 'migrate-front' && 'shared-url-map' || inputs.deploy_environment }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SUBROUTER_GCP_PROJECT: ${{ vars.SUBROUTER_GCP_PROJECT }}
  SUBROUTER_GCP_ZONE: ${{ vars.SUBROUTER_GCP_ZONE }}
  SUBROUTER_GCP_INSTANCE: ${{ inputs.deploy_environment == 'production' && 'subrouter-team' || 'subrouter-staging' }}
  SUBROUTER_PUBLIC_BASE_URL: ${{ inputs.deploy_environment == 'production' && 'https://sr.cmux.com' || 'https://staging.sr.cmux.com' }}
  SUBROUTER_RELEASE_TAG: ${{ inputs.release_tag }}
  SUBROUTER_RELEASE_ARCH: amd64
  SUBROUTER_RELEASE_OUTPUT: ${{ github.workspace }}/dist/subrouter-linux-amd64
  SUBROUTER_DEPLOY_BINARY: ${{ github.workspace }}/dist/subrouter-linux-amd64
  SUBROUTER_RELEASE_SHA256_FILE: ${{ github.workspace }}/dist/subrouter-linux-amd64.sha256

jobs:
  deploy:
    name: Preflight ${{ inputs.release_tag }} for ${{ inputs.deploy_environment }} ${{ inputs.operation }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: subrouter-${{ inputs.deploy_environment }}
    steps:
      - name: Check out trusted deployment tooling
        uses: actions/checkout@v6
        with:
          ref: main
          path: deploy-tooling

      - name: Check out matching release source for observer tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}
          path: release-source
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: release-source/go.mod

      - name: Verify trusted release before Google authentication
        working-directory: deploy-tooling
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/dist" "${GITHUB_WORKSPACE}/artifacts/build-provenance"
          deploy/gcp/fetch-release.sh | tee "${GITHUB_WORKSPACE}/artifacts/build-provenance/release-fetch.txt"
          release_state="$(gh release view "${SUBROUTER_RELEASE_TAG}" --repo manaflow-ai/subrouter \
            --json isDraft,isImmutable,tagName,targetCommitish)"
          jq -e --arg tag "${SUBROUTER_RELEASE_TAG}" \
            '.tagName == $tag and (.isDraft | not) and .isImmutable' <<<"${release_state}" >/dev/null
          printf '%s\n' "${release_state}" >"${GITHUB_WORKSPACE}/artifacts/build-provenance/release-state.json"
          gh release verify-asset "${SUBROUTER_RELEASE_TAG}" "${SUBROUTER_DEPLOY_BINARY}" \
            --repo manaflow-ai/subrouter --format json \
            >"${GITHUB_WORKSPACE}/artifacts/build-provenance/immutable-asset-verification.json"
          metadata="$(go version -m "${SUBROUTER_DEPLOY_BINARY}")"
          printf '%s\n' "${metadata}" | tee "${GITHUB_WORKSPACE}/artifacts/build-provenance/candidate.txt"
          release_commit="$(git -C "${GITHUB_WORKSPACE}/release-source" rev-parse HEAD)"
          printf '%s\n' "${release_commit}" | tee "${GITHUB_WORKSPACE}/artifacts/build-provenance/release-source-commit.txt"
          git -C "${GITHUB_WORKSPACE}/release-source" fetch --no-tags origin main
          git -C "${GITHUB_WORKSPACE}/release-source" merge-base --is-ancestor \
            "${release_commit}" origin/main || {
              echo "release tag commit is not on protected main" >&2
              exit 1
            }
          grep -Fq "vcs.revision=${release_commit}" <<<"${metadata}"
          grep -Fq "vcs.modified=false" <<<"${metadata}"
          verification="$(gh attestation verify "${SUBROUTER_DEPLOY_BINARY}" \
            --repo manaflow-ai/subrouter \
            --signer-workflow manaflow-ai/subrouter/.github/workflows/release.yml \
            --source-ref "refs/tags/${SUBROUTER_RELEASE_TAG}" \
            --source-digest "${release_commit}" \
            --deny-self-hosted-runners --format json)"
          jq --arg release_tag "${SUBROUTER_RELEASE_TAG}" --arg source_revision "${release_commit}" \
            '{release_tag:$release_tag,source_revision:$source_revision,tag_on_main:true,
              release_published:true,release_immutable:true,asset_digest_verified:true,
              attestation_verified:(length > 0),verified_attestations:length,
              subjects:[.[].verificationResult.statement.subject[] | {name,digest}]}' \
            <<<"${verification}" \
            >"${GITHUB_WORKSPACE}/artifacts/build-provenance/release-verification.json"
          jq -e '.tag_on_main and .release_published and .release_immutable and
            .asset_digest_verified and .attestation_verified' \
            "${GITHUB_WORKSPACE}/artifacts/build-provenance/release-verification.json" >/dev/null
          {
            echo "SUBROUTER_DEPLOY_REVISION=${release_commit}"
            echo "SUBROUTER_RELEASE_TAG_ON_MAIN=true"
            echo "SUBROUTER_RELEASE_ATTESTATION_VERIFIED=true"
            echo "SUBROUTER_RELEASE_IMMUTABLE=true"
          } >>"${GITHUB_ENV}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.SUBROUTER_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SUBROUTER_GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Validate live topology without mutation
        working-directory: deploy-tooling
        env:
          SUBROUTER_PREFLIGHT_TOPOLOGY: ${{ inputs.operation }}
          SUBROUTER_DEPLOY_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/gcp-preflight
        run: deploy/gcp/preflight-deployment.sh --evidence-json "${GITHUB_WORKSPACE}/artifacts/gcp-preflight/result.json"

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: gcp-${{ inputs.deploy_environment }}-${{ inputs.operation }}-${{ inputs.release_tag }}-${{ github.run_attempt }}
          path: artifacts
          if-no-files-found: warn
