name: Cloudflare Durable Object

on:
  pull_request:
    paths:
      - ".github/workflows/cloudflare-do.yml"
      - "cloudflare/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cloudflare-do.yml"
      - "cloudflare/**"
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: "Cloudflare environment to deploy"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: cloudflare-do-${{ github.event_name == 'workflow_dispatch' && inputs.deploy_environment || github.ref }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize Cloudflare source
    # This job has no deployment secret. It fails closed for a manual or push
    # event that is not the protected main workflow revision. Pull requests
    # remain available for read-only verification, including fork PRs.
    if: >-
      github.repository == 'manaflow-ai/subrouter' &&
      (
        github.event_name == 'pull_request' ||
        (
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main' &&
          github.workflow_ref == 'manaflow-ai/subrouter/.github/workflows/cloudflare-do.yml@refs/heads/main'
        )
      )
    runs-on: ubuntu-24.04 # github-hosted-required: Cloudflare policy jobs
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.authorize.outputs.source_sha || '' }}
      deploy_authorized: ${{ steps.authorize.outputs.deploy_authorized || 'false' }}
    steps:
      - name: Require GitHub-hosted runner
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${RUNNER_ENVIRONMENT}" == github-hosted ]] || {
            echo "::error title=Runner policy::Cloudflare policy jobs require a GitHub-hosted runner."
            exit 1
          }
      - name: Checkout authorization helper
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts/authorize-cloudflare-deploy.sh
          sparse-checkout-cone-mode: false
      - name: Validate protected Cloudflare source
        id: authorize
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REPOSITORY: ${{ github.event.repository.full_name || '' }}
          EVENT_REF: ${{ github.ref }}
          EVENT_REF_PROTECTED: ${{ github.ref_protected }}
          EVENT_SHA: ${{ github.sha }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: bash .github/scripts/authorize-cloudflare-deploy.sh

  verify:
    name: Verify
    needs: authorize
    if: needs.authorize.result == 'success'
    runs-on: ubuntu-24.04 # github-hosted-required: Cloudflare policy jobs
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Require GitHub-hosted runner
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${RUNNER_ENVIRONMENT}" == github-hosted ]] || {
            echo "::error title=Runner policy::Cloudflare policy jobs require a GitHub-hosted runner."
            exit 1
          }
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.authorize.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "${EXPECTED_SOURCE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "${EXPECTED_SOURCE_SHA}" ]] || {
            echo "::error title=Source policy::The checkout does not match the authorized source commit."
            exit 1
          }

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install
        working-directory: cloudflare
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: cloudflare
        run: bun run typecheck

      - name: Test
        working-directory: cloudflare
        run: bun run test

      - name: Validate Worker bundle
        working-directory: cloudflare/packages/worker
        run: bunx wrangler deploy --env staging --dry-run --outdir dist-dry-run

  deploy-staging:
    name: Deploy staging
    needs: [authorize, verify]
    runs-on: ubuntu-24.04 # github-hosted-required: Cloudflare policy jobs
    timeout-minutes: 15
    if: >-
      needs.authorize.result == 'success' &&
      needs.verify.result == 'success' &&
      needs.authorize.outputs.deploy_authorized == 'true' &&
      github.repository == 'manaflow-ai/subrouter' &&
      github.ref == 'refs/heads/main' &&
      github.ref_protected == true &&
      github.workflow_ref == 'manaflow-ai/subrouter/.github/workflows/cloudflare-do.yml@refs/heads/main' &&
      (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy_environment == 'staging')
      )
    environment:
      name: subrouter-staging
      url: https://subrouter-staging.cmux.dev/healthz
    permissions:
      contents: read
    steps:
      - name: Require GitHub-hosted runner
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${RUNNER_ENVIRONMENT}" == github-hosted ]] || {
            echo "::error title=Runner policy::Cloudflare policy jobs require a GitHub-hosted runner."
            exit 1
          }
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.authorize.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "${EXPECTED_SOURCE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "${EXPECTED_SOURCE_SHA}" ]] || {
            echo "::error title=Source policy::The checkout does not match the authorized source commit."
            exit 1
          }

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install
        working-directory: cloudflare
        run: bun install --frozen-lockfile

      - name: Deploy
        working-directory: cloudflare/packages/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=Missing CLOUDFLARE_API_TOKEN::Set a long-lived Cloudflare API token in the subrouter repository or subrouter-staging environment secrets."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error title=Missing CLOUDFLARE_ACCOUNT_ID::Set the Cloudflare account ID in the subrouter repository or subrouter-staging environment secrets."
            exit 1
          fi
          bunx wrangler deploy --env staging --keep-vars

      - name: Smoke health
        run: curl -fsS https://subrouter-staging.cmux.dev/healthz

  deploy-production:
    name: Deploy production
    needs:
      - authorize
      - verify
      - deploy-staging
    runs-on: ubuntu-24.04 # github-hosted-required: Cloudflare policy jobs
    timeout-minutes: 15
    if: >-
      needs.authorize.result == 'success' &&
      needs.verify.result == 'success' &&
      needs.deploy-staging.result == 'success' &&
      needs.authorize.outputs.deploy_authorized == 'true' &&
      github.repository == 'manaflow-ai/subrouter' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.ref_protected == true &&
      github.workflow_ref == 'manaflow-ai/subrouter/.github/workflows/cloudflare-do.yml@refs/heads/main'
    environment:
      name: subrouter-production
      url: https://subrouter.cmux.dev/healthz
    permissions:
      contents: read
    steps:
      - name: Require GitHub-hosted runner
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${RUNNER_ENVIRONMENT}" == github-hosted ]] || {
            echo "::error title=Runner policy::Cloudflare policy jobs require a GitHub-hosted runner."
            exit 1
          }
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.authorize.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "${EXPECTED_SOURCE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "${EXPECTED_SOURCE_SHA}" ]] || {
            echo "::error title=Source policy::The checkout does not match the authorized source commit."
            exit 1
          }

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install
        working-directory: cloudflare
        run: bun install --frozen-lockfile

      - name: Deploy
        working-directory: cloudflare/packages/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=Missing CLOUDFLARE_API_TOKEN::Set a long-lived Cloudflare API token in the subrouter repository or subrouter-production environment secrets."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error title=Missing CLOUDFLARE_ACCOUNT_ID::Set the Cloudflare account ID in the subrouter repository or subrouter-production environment secrets."
            exit 1
          fi
          bunx wrangler deploy --env production --keep-vars

      - name: Smoke health
        run: curl -fsS https://subrouter.cmux.dev/healthz

  deploy-production-manual:
    name: Deploy production manual
    needs: [authorize, verify]
    runs-on: ubuntu-24.04 # github-hosted-required: Cloudflare policy jobs
    timeout-minutes: 15
    if: >-
      needs.authorize.result == 'success' &&
      needs.verify.result == 'success' &&
      needs.authorize.outputs.deploy_authorized == 'true' &&
      github.repository == 'manaflow-ai/subrouter' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy_environment == 'production' &&
      github.ref == 'refs/heads/main' &&
      github.ref_protected == true &&
      github.workflow_ref == 'manaflow-ai/subrouter/.github/workflows/cloudflare-do.yml@refs/heads/main'
    environment:
      name: subrouter-production
      url: https://subrouter.cmux.dev/healthz
    permissions:
      contents: read
    steps:
      - name: Require GitHub-hosted runner
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${RUNNER_ENVIRONMENT}" == github-hosted ]] || {
            echo "::error title=Runner policy::Cloudflare policy jobs require a GitHub-hosted runner."
            exit 1
          }
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.authorize.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "${EXPECTED_SOURCE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "${EXPECTED_SOURCE_SHA}" ]] || {
            echo "::error title=Source policy::The checkout does not match the authorized source commit."
            exit 1
          }

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install
        working-directory: cloudflare
        run: bun install --frozen-lockfile

      - name: Deploy
        working-directory: cloudflare/packages/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=Missing CLOUDFLARE_API_TOKEN::Set a long-lived Cloudflare API token in the subrouter repository or subrouter-production environment secrets."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error title=Missing CLOUDFLARE_ACCOUNT_ID::Set the Cloudflare account ID in the subrouter repository or subrouter-production environment secrets."
            exit 1
          fi
          bunx wrangler deploy --env production --keep-vars

      - name: Smoke health
        run: curl -fsS https://subrouter.cmux.dev/healthz
