name: Cloudflare Durable Object

on:
  pull_request:
    paths:
      - ".github/workflows/cloudflare-do.yml"
      - "cloudflare/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cloudflare-do.yml"
      - "cloudflare/**"
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: "Cloudflare environment to deploy"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  # Keep trusted push/manual deployments in one queue. Public PR verification
  # has a separate per-PR queue and cannot delay a deployment.
  group: >-
    cloudflare-do-${{
      github.event_name == 'pull_request' &&
      format('verify-{0}', github.event.pull_request.number) ||
      'deploy'
    }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install
        working-directory: cloudflare
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: cloudflare
        run: bun run typecheck

      - name: Test
        working-directory: cloudflare
        run: bun run test

      - name: Validate Worker bundle
        working-directory: cloudflare/packages/worker
        run: bunx --no-install wrangler deploy --env staging --dry-run --outdir dist-dry-run

  deploy-staging:
    name: Deploy staging
    needs: verify
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'manaflow-ai/subrouter' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' &&
         github.ref == 'refs/heads/main' &&
         inputs.deploy_environment == 'staging')
      )
    environment:
      name: subrouter-staging
      url: https://subrouter-staging.cmux.dev/healthz
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Deploy exactly the commit that the read-only verify job tested.
          # The job guard limits that SHA to a protected-main trigger.
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install
        working-directory: cloudflare
        run: bun install --frozen-lockfile

      - name: Deploy
        working-directory: cloudflare/packages/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=Missing CLOUDFLARE_API_TOKEN::Set a long-lived Cloudflare API token in the subrouter repository or subrouter-staging environment secrets."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error title=Missing CLOUDFLARE_ACCOUNT_ID::Set the Cloudflare account ID in the subrouter repository or subrouter-staging environment secrets."
            exit 1
          fi
          bunx --no-install wrangler deploy --env staging --keep-vars

      - name: Smoke health
        run: curl -fsS https://subrouter-staging.cmux.dev/healthz

  deploy-production:
    name: Deploy production
    needs:
      - verify
      - deploy-staging
    runs-on: ubuntu-latest
    if: github.repository == 'manaflow-ai/subrouter' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: subrouter-production
      url: https://subrouter.cmux.dev/healthz
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Deploy exactly the commit that the read-only verify job tested.
          # The job guard limits that SHA to a protected-main trigger.
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install
        working-directory: cloudflare
        run: bun install --frozen-lockfile

      - name: Deploy
        working-directory: cloudflare/packages/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=Missing CLOUDFLARE_API_TOKEN::Set a long-lived Cloudflare API token in the subrouter repository or subrouter-production environment secrets."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error title=Missing CLOUDFLARE_ACCOUNT_ID::Set the Cloudflare account ID in the subrouter repository or subrouter-production environment secrets."
            exit 1
          fi
          bunx --no-install wrangler deploy --env production --keep-vars

      - name: Smoke health
        run: curl -fsS https://subrouter.cmux.dev/healthz

  deploy-production-manual:
    name: Deploy production manual
    needs: verify
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'manaflow-ai/subrouter' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.deploy_environment == 'production'
    environment:
      name: subrouter-production
      url: https://subrouter.cmux.dev/healthz
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Deploy exactly the commit that the read-only verify job tested.
          # The job guard limits that SHA to a protected-main trigger.
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install
        working-directory: cloudflare
        run: bun install --frozen-lockfile

      - name: Deploy
        working-directory: cloudflare/packages/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=Missing CLOUDFLARE_API_TOKEN::Set a long-lived Cloudflare API token in the subrouter repository or subrouter-production environment secrets."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error title=Missing CLOUDFLARE_ACCOUNT_ID::Set the Cloudflare account ID in the subrouter repository or subrouter-production environment secrets."
            exit 1
          fi
          bunx --no-install wrangler deploy --env production --keep-vars

      - name: Smoke health
        run: curl -fsS https://subrouter.cmux.dev/healthz
